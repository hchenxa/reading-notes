apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-team-b-dev
  namespace: argocd
spec:
  project: team-b
  source:
    repoURL: https://github.com/hchenxa/reading-notes.git
    targetRevision: main
    path: ArgoCD/labs/guestbook
  destination:
    name: in-cluster
    namespace: team-b-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
