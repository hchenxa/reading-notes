# 复制到 /tmp 后填入 bcrypt hash，不要提交真实密码。
# 生成 hash：
#   argocd account bcrypt --password '<your-password>'
# 应用：
#   kubectl -n argocd patch secret argocd-secret --type merge --patch-file /tmp/local-accounts-secret.yaml
stringData:
  accounts.tenant-a-viewer.password: REPLACE_WITH_BCRYPT_HASH
  accounts.tenant-b-viewer.password: REPLACE_WITH_BCRYPT_HASH
  accounts.tenant-a-developer.password: REPLACE_WITH_BCRYPT_HASH
