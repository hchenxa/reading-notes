# 复制到 /tmp 再填写，不要把真实 secret 提交进仓库：
#   cp secret.example.yaml /tmp/argocd-github-oauth.yaml
#   编辑 /tmp/argocd-github-oauth.yaml，替换 REPLACE_WITH_GITHUB_CLIENT_SECRET
#   kubectl apply -f /tmp/argocd-github-oauth.yaml
apiVersion: v1
kind: Secret
metadata:
  name: argocd-github-oauth
  namespace: argocd
  labels:
    # 自定义 Secret 必须带这个 label，Argo CD 才会读取
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  dex.github.clientSecret: REPLACE_WITH_GITHUB_CLIENT_SECRET
