    # ── 443 上的第二个域名 other.example.com(同一 IP 多证书)
    server {
        listen       443 ssl;
        server_name  other.example.com;

        ssl_certificate     @EXTRA_CERT@;
        ssl_certificate_key @EXTRA_KEY@;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://127.0.0.1:8080;
        }
    }
