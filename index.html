<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Reading Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- 侧栏分组折叠(箭头指示;CSS 换 sidebar-folder.min.css 可改成文件夹图标风格) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.5/dist/sidebar.min.css">
  <style>
    .markdown-section img {
      loading: lazy;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Reading Notes',
      repo: 'https://github.com/hchenxa/reading-notes',
      loadSidebar: true,
      subMaxLevel: 3,
      search: {
        placeholder: '搜索',
        noData: '没有找到结果',
        depth: 3
      },
      auto2top: true,
      basePath: '/reading-notes/',
      relativePath: true,
      // 侧栏折叠插件配置:sidebarDisplayLevel = 默认展开到第几层分组
      //   0 = 全部收起(只留 "Home" 与主题名,当前页所在分组自动展开)——侧栏不再一进来就巨长
      //   1 = 默认展开第一层分组(主题的下一级仍折叠)
      sidebarDisplayLevel: 0,
      plugins: [
        // 侧栏：别把"当前页的章节目录"和"子页面列表"混在同一层。
        //
        // subMaxLevel 会把当前页的章节（链接带 ?id=）追加进侧栏，作为该条目下**另一个**
        // ul。子页没有下挂条目，看着正常；但主题索引页（README 自己还有子页）上，同一个
        // 缩进里就一半是本页章节、一半是子页面，顺序还随页面翻转 —— 视线上完全分不清。
        //
        // 这里只做一件事：**当某个条目下面既有子页、又有本页章节目录时，把章节目录摘掉。**
        // 于是"有子页的页面"侧栏只列导航；长子页（没有下挂条目）照常保留章节导航。
        function (hook) {
          hook.doneEach(function () {
            var nav = document.querySelector('.sidebar-nav');
            if (!nav) return;
            var isToc = function (a) { return (a.getAttribute('href') || '').indexOf('?id=') >= 0; };
            // 当前页在侧栏里对应的条目：.active 有时挂在 li 上，有时挂在外层 P 上
            var act = nav.querySelector('.active');
            if (!act) return;
            var entry = act.tagName === 'LI' ? act : act.closest('li');
            if (!entry) return;
            var self = entry.querySelector(':scope > a, :scope > p > a');
            // 该条目下除了它自己，还有没有"真正的子页"（非 ?id= 的链接）。
            // 注意别按 ul 的结构判断 —— 章节目录那个 ul 与子页那个 ul 的先后顺序
            // 在实测里不稳定，而且折叠插件还往 P 里塞过 ul，结构不可靠。
            var hasChildPages = Array.prototype.some.call(entry.querySelectorAll('a'), function (a) {
              return a !== self && !isToc(a);
            });
            if (!hasChildPages) return;
            // 有子页 → 把本页的章节目录摘掉（侧栏里同一时刻只会有当前页的那一份）
            Array.prototype.forEach.call(nav.querySelectorAll('li'), function (li) {
              var a = li.querySelector(':scope > a, :scope > p > a');
              if (a && isToc(a)) li.remove();
            });
          });
        },
        // mermaid 图表渲染（按需加载）。
        // mermaid 的 ESM 包约 3.5MB，所以不做全站预加载：只有当前页真的出现
        // ```mermaid 代码块时才动态 import，没有图表的页面完全不付这个成本。
        function (hook) {
          // docsify 的代码块渲染器输出的是 <pre data-lang="mermaid"><code class="lang-mermaid">,
          // 即 lang-* 而不是 Prism 惯用的 language-*。两种都匹配，免得选择器落空(图静默不渲染)。
          var SELECTOR = '.markdown-section pre > code.lang-mermaid, .markdown-section pre > code.language-mermaid';
          hook.doneEach(function () {
            // 先查一次，没有图表就直接返回，连 import 都不触发
            if (!document.querySelector(SELECTOR)) return;
            var ready = window.mermaid
              ? Promise.resolve(window.mermaid)
              : import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')
                  .then(function (m) { window.mermaid = m.default; return m.default; });
            ready.then(function (mermaid) {
              // 异步加载期间用户可能已经切页，所以这里重新查询，不复用旧节点引用
              var blocks = document.querySelectorAll(SELECTOR);
              if (!blocks.length) return;
              mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
              Array.prototype.forEach.call(blocks, function (code) {
                var div = document.createElement('div');
                div.className = 'mermaid';
                // Prism 对未知语言会退回 markup 语法并插入高亮 span，但 textContent 仍是原始代码
                div.textContent = code.textContent;
                if (code.parentElement) code.parentElement.replaceWith(div);
              });
              return mermaid.run({ querySelector: '.markdown-section .mermaid:not([data-processed])' });
            }).catch(function (err) {
              // import 失败或语法错误:打日志,别让图表静默消失(err 可能是 Error 或 mermaid 的报错对象)
              console.error('[mermaid] 渲染失败:', (err && (err.message || err.str)) || err);
            });
          });
        }
      ],
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- 侧栏分组折叠插件(必须在 docsify 核心之后加载) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.5/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
</body>
</html>
