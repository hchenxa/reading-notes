# kind 节点内 containerd / kubelet 的代理配置（macOS 系统代理场景）
#
# 背景：mac 的系统代理是 127.0.0.1:7890，容器运行时会把这个代理作为
# HTTP_PROXY/HTTPS_PROXY 注入到节点里，但节点里的 127.0.0.1 指的是节点自己的
# loopback，不是 mac，于是镜像拉取报：
#   proxyconnect tcp: dial tcp 127.0.0.1:7890: connect: connection refused
#
# 修复：把代理指向「节点内可达的宿主地址」host.docker.internal
#   - Docker Desktop 和 colima 都会提供这个别名。colima 是靠 dockerd 的
#     --host-gateway-ip=<VM 网关> 实现的，实测节点内解析为 192.168.5.2。
#   - 不要用占位符（如 __HOST_IP__）指望 kind 替换：kind 不做这种替换，
#     字符串会原样落进节点，kubelet 会去解析一个叫 __HOST_IP__ 的域名然后启动失败。
#   - Podman Machine 下的对应别名是 host.containers.internal。
#
# NO_PROXY 必须覆盖集群自己的网段：kubelet 要连 API server，地址在 docker 网桥
# 172.18.0.0/16 上（172.17.0.0/16 是 docker0），漏掉就会走代理而注册不上节点。
#
# 用法：见同目录 kind-config.yaml
[Service]
Environment="HTTP_PROXY=http://host.docker.internal:7890"
Environment="HTTPS_PROXY=http://host.docker.internal:7890"
Environment="NO_PROXY=localhost,127.0.0.1,::1,10.0.0.0/8,10.244.0.0/16,10.96.0.0/16,172.17.0.0/16,172.18.0.0/16,192.168.0.0/16,.svc,.svc.cluster.local"
